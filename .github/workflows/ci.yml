name: checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python deps
        run: pip install pillow numpy

      - name: Node syntax check
        run: |
          node --check tools/test_encode.js
          node --check tools/test_ui.js

      - name: Python syntax check
        run: python -m py_compile tools/validate_output.py tools/make_test_images.py

      - name: App smoke check
        run: |
          test -f index.html
          grep -q "__hdrApp" index.html
